<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JEE Main Conceptual Clarity Heatmap</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f0f4f8;
    --card: #ffffff;
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --danger: #ef4444;
    --success: #10b981;
    --text: #1e293b;
    --muted: #64748b;
    --border: #e2e8f0;
    --shadow: 0 4px 24px rgba(0,0,0,0.08);
    --radius: 16px;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 32px 16px;
  }
  header {
    text-align: center;
    margin-bottom: 40px;
  }
  header h1 {
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    font-weight: 800;
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
  }
  header p {
    color: var(--muted);
    font-size: 1rem;
  }
  .container { max-width: 1100px; margin: 0 auto; }
  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 28px 32px;
    margin-bottom: 28px;
    border: 1px solid var(--border);
    transition: box-shadow 0.2s;
  }
  .card:hover { box-shadow: 0 8px 40px rgba(0,0,0,0.12); }
  .card-title {
    font-size: 1.2rem;
    font-weight: 700;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .badge {
    display: inline-block;
    padding: 3px 12px;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.04em;
  }
  .badge-physics { background: #dbeafe; color: #1d4ed8; }
  .badge-chemistry { background: #d1fae5; color: #065f46; }
  .badge-mathematics { background: #fce7f3; color: #9d174d; }
  .chapters-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 14px;
  }
  .chapter-row {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--bg);
    border-radius: 10px;
    padding: 10px 14px;
    transition: background 0.15s;
  }
  .chapter-row:hover { background: #e8edf5; }
  .chapter-name {
    flex: 1;
    font-size: 0.88rem;
    font-weight: 500;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chapter-row select {
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 5px 8px;
    font-size: 0.82rem;
    background: white;
    color: var(--text);
    cursor: pointer;
    outline: none;
    transition: border-color 0.15s;
    min-width: 118px;
  }
  .chapter-row select:focus { border-color: var(--primary); }
  .chapter-row .val-display {
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--primary);
    width: 30px;
    text-align: right;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    align-items: center;
    justify-content: center;
    margin: 28px 0;
  }
  button {
    padding: 12px 28px;
    border: none;
    border-radius: 10px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.12s, box-shadow 0.12s, background 0.15s;
    outline: none;
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.15); }
  button:active { transform: translateY(0); }
  .btn-primary { background: var(--primary); color: white; }
  .btn-primary:hover { background: var(--primary-hover); }
  .btn-danger { background: var(--danger); color: white; }
  .btn-success { background: var(--success); color: white; }
  .stats-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    justify-content: center;
    margin-bottom: 24px;
  }
  .stat-pill {
    background: white;
    border: 1.5px solid var(--border);
    border-radius: 999px;
    padding: 8px 20px;
    font-size: 0.88rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  }
  .stat-dot { width: 10px; height: 10px; border-radius: 50%; }
  .readiness-tag {
    display: inline-block;
    padding: 4px 16px;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 700;
  }
  .risk-high { background: #fee2e2; color: #b91c1c; }
  .risk-moderate { background: #fef3c7; color: #92400e; }
  .risk-strong { background: #d1fae5; color: #065f46; }
  #heatmap-section { display: none; }
  #heatmap-canvas {
    border-radius: 12px;
    width: 100%;
    max-width: 100%;
    display: block;
    margin: 0 auto;
  }
  .canvas-wrapper {
    overflow-x: auto;
    border-radius: 12px;
  }
  @media(max-width:600px) {
    .card { padding: 18px 14px; }
    .chapters-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>JEE Main Conceptual Clarity Heatmap</h1>
    <p>Rate your understanding for each chapter to visualize your preparation</p>
  </header>

  <div id="survey-section"></div>

  <div class="controls">
    <button class="btn-primary" onclick="App.generateHeatmap()">📊 Generate Heatmap</button>
    <button class="btn-danger" onclick="App.resetAll()">🔄 Reset All</button>
  </div>

  <div id="heatmap-section">
    <div class="stats-bar" id="stats-bar"></div>
    <div class="card" style="padding:20px;">
      <div class="canvas-wrapper">
        <canvas id="heatmap-canvas"></canvas>
      </div>
      <div style="text-align:center;margin-top:18px;">
        <button class="btn-success" onclick="App.downloadJPG()">⬇️ Download Heatmap as JPG</button>
      </div>
    </div>
  </div>
</div>

<script>
const App = (() => {
  /* ── Data ── */
  const SUBJECTS = [
    {
      name: 'Physics',
      key: 'physics',
      badge: 'badge-physics',
      chapters: [
        'Units & Dimensions','Kinematics','Laws of Motion',
        'Work, Energy & Power','Rotational Motion','Gravitation',
        'Thermodynamics','Oscillations & Waves','Electrostatics',
        'Current Electricity','Magnetic Effects','Electromagnetic Induction',
        'Optics','Modern Physics','Semiconductor Devices'
      ]
    },
    {
      name: 'Chemistry',
      key: 'chemistry',
      badge: 'badge-chemistry',
      chapters: [
        'Basic Concepts','Atomic Structure','Chemical Bonding',
        'States of Matter','Thermodynamics (Chem)','Equilibrium',
        'Redox Reactions','Electrochemistry','Chemical Kinetics',
        'Surface Chemistry','P-Block Elements','D & F Block',
        'Coordination Compounds','Organic Basics','Biomolecules'
      ]
    },
    {
      name: 'Mathematics',
      key: 'mathematics',
      badge: 'badge-mathematics',
      chapters: [
        'Sets & Relations','Complex Numbers','Quadratic Equations',
        'Permutations & Combinations','Binomial Theorem','Sequences & Series',
        'Limits & Continuity','Differentiation','Integration',
        'Differential Equations','Coordinate Geometry','Vectors',
        '3D Geometry','Probability','Matrices & Determinants'
      ]
    }
  ];

  const DROPDOWN_MAP = {
    'very_weak': 10, 'weak': 30, 'moderate': 55, 'strong': 75, 'mastered': 95
  };

  /* internal state */
  const state = {};

  function getKey(subjectKey, chapterIdx) {
    return `${subjectKey}_${chapterIdx}`;
  }

  function getValue(subjectKey, chapterIdx) {
    const k = getKey(subjectKey, chapterIdx);
    return state[k] !== undefined ? state[k] : 55;
  }

  function buildSurvey() {
    const el = document.getElementById('survey-section');
    el.innerHTML = '';
    SUBJECTS.forEach(subject => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `<div class="card-title"><span>${subject.name === 'Physics' ? '⚛️' : subject.name === 'Chemistry' ? '🧪' : '📐'}</span> ${subject.name} <span class="badge ${subject.badge}">${subject.chapters.length} chapters</span></div>`;
      const grid = document.createElement('div');
      grid.className = 'chapters-grid';
      subject.chapters.forEach((chapter, idx) => {
        const row = document.createElement('div');
        row.className = 'chapter-row';
        const initVal = getValue(subject.key, idx);
        const initKey = Object.entries(DROPDOWN_MAP).find(([,v]) => v === initVal)?.[0] || 'moderate';
        row.innerHTML = `
          <span class="chapter-name" title="${chapter}">${chapter}</span>
          <select id="sel_${subject.key}_${idx}" onchange="App.onSelect('${subject.key}',${idx},this.value)">
            <option value="very_weak" ${initKey==='very_weak'?'selected':''}>Very Weak</option>
            <option value="weak" ${initKey==='weak'?'selected':''}>Weak</option>
            <option value="moderate" ${initKey==='moderate'?'selected':''}>Moderate</option>
            <option value="strong" ${initKey==='strong'?'selected':''}>Strong</option>
            <option value="mastered" ${initKey==='mastered'?'selected':''}>Mastered</option>
          </select>
          <span class="val-display" id="vd_${subject.key}_${idx}">${initVal}</span>
        `;
        grid.appendChild(row);
      });
      card.appendChild(grid);
      el.appendChild(card);
    });
  }

  function onSelect(subjectKey, chapterIdx, dropdownVal) {
    const num = DROPDOWN_MAP[dropdownVal];
    state[getKey(subjectKey, chapterIdx)] = num;
    const vd = document.getElementById(`vd_${subjectKey}_${chapterIdx}`);
    if (vd) vd.textContent = num;
  }

  /* ── Color: Red (0) → Orange → Yellow → Cyan → Blue → Violet (100) ── */
  function scoreToColor(val) {
    // Spectrum: Red → Orange → Yellow → Lime → Cyan → Blue → Violet
    const stops = [
      [0,   [220, 30,  30]],   // Red
      [20,  [230, 100, 20]],   // Orange
      [40,  [220, 200, 20]],   // Yellow
      [55,  [120, 210, 50]],   // Lime-green
      [70,  [30,  190, 200]],  // Cyan
      [85,  [60,  80,  210]],  // Blue
      [100, [148, 0,   211]],  // Violet
    ];
    let lo = stops[0], hi = stops[stops.length - 1];
    for (let i = 0; i < stops.length - 1; i++) {
      if (val >= stops[i][0] && val <= stops[i+1][0]) { lo = stops[i]; hi = stops[i+1]; break; }
    }
    const t = (val - lo[0]) / (hi[0] - lo[0]);
    const r = Math.round(lo[1][0] + t * (hi[1][0] - lo[1][0]));
    const g = Math.round(lo[1][1] + t * (hi[1][1] - lo[1][1]));
    const b = Math.round(lo[1][2] + t * (hi[1][2] - lo[1][2]));
    return `rgb(${r},${g},${b})`;
  }

  /* ── Heatmap rendering ── */
  function generateHeatmap() {
    // Collect current values from selects
    SUBJECTS.forEach(subject => {
      subject.chapters.forEach((_, idx) => {
        const sel = document.getElementById(`sel_${subject.key}_${idx}`);
        if (sel) state[getKey(subject.key, idx)] = DROPDOWN_MAP[sel.value];
      });
    });

    const maxChapters = Math.max(...SUBJECTS.map(s => s.chapters.length));

    // Cell dimensions — wider to fit chapter names
    const CELL_W = 110, CELL_H = 62;
    // Rotate label area: enough height for longest rotated name (~140px for ~20 char names)
    const LABEL_LEFT = 190, LABEL_TOP = 90, LEGEND_H = 90;
    const PADDING = 50;
    const W = LABEL_LEFT + maxChapters * CELL_W + PADDING;
    const H = LABEL_TOP + SUBJECTS.length * CELL_H + LEGEND_H + PADDING;

    const SCALE = 3;
    const canvas = document.getElementById('heatmap-canvas');
    canvas.width = W * SCALE;
    canvas.height = H * SCALE;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    const ctx = canvas.getContext('2d');
    ctx.scale(SCALE, SCALE);

    // White background
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);

    // Title
    ctx.fillStyle = '#1e293b';
    ctx.font = 'bold 20px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('JEE Main Conceptual Clarity Heatmap', W / 2, 32);

    // Subtitle
    ctx.font = '12px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif';
    ctx.fillStyle = '#64748b';
    ctx.fillText('Self-Assessment  |  Score: 0 (Weakest) → 100 (Mastered)', W / 2, 54);

    const maxChLen = maxChapters;

    // X-axis: simple Ch 1, Ch 2... above each column
    ctx.save();
    ctx.font = 'bold 10px -apple-system,BlinkMacSystemFont,sans-serif';
    ctx.fillStyle = '#64748b';
    ctx.textAlign = 'center';
    for (let c = 0; c < maxChLen; c++) {
      const x = LABEL_LEFT + c * CELL_W + CELL_W / 2;
      ctx.fillText(`Ch ${c + 1}`, x, LABEL_TOP - 10);
    }
    ctx.restore();

    // ── Draw cells
    SUBJECTS.forEach((subject, sIdx) => {
      const y = LABEL_TOP + sIdx * CELL_H;

      // Subject label (left side)
      ctx.font = 'bold 13px -apple-system,BlinkMacSystemFont,sans-serif';
      ctx.textAlign = 'right';
      ctx.fillStyle = '#1e293b';
      ctx.fillText(subject.name, LABEL_LEFT - 14, y + CELL_H / 2 + 5);

      subject.chapters.forEach((chapter, cIdx) => {
        const val = getValue(subject.key, cIdx);
        const x = LABEL_LEFT + cIdx * CELL_W;
        const color = scoreToColor(val);

        // Cell background
        ctx.fillStyle = color;
        ctx.beginPath();
        roundRect(ctx, x + 2, y + 2, CELL_W - 4, CELL_H - 4, 7);
        ctx.fill();

        // Subtle inner border
        ctx.strokeStyle = 'rgba(255,255,255,0.4)';
        ctx.lineWidth = 1;
        ctx.stroke();

        // Score value (large, centered)
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 14px -apple-system,BlinkMacSystemFont,sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(val, x + CELL_W / 2, y + CELL_H / 2 + 2);

        // Chapter name inside cell (small, bottom) — subject-specific name
        ctx.font = '7.5px -apple-system,sans-serif';
        ctx.fillStyle = 'rgba(255,255,255,0.90)';
        const shortName = chapter.length > 14 ? chapter.substring(0, 13) + '…' : chapter;
        ctx.fillText(shortName, x + CELL_W / 2, y + CELL_H - 7);
      });
    });

    // ── Legend
    const legendY = LABEL_TOP + SUBJECTS.length * CELL_H + 24;
    const legendX = LABEL_LEFT;
    const legendBarH = 20;
    const barW = Math.min(maxChLen * CELL_W - 90, 500);

    ctx.font = 'bold 11px -apple-system,sans-serif';
    ctx.fillStyle = '#1e293b';
    ctx.textAlign = 'left';
    ctx.fillText('Spectrum Scale (Red → Violet):', legendX, legendY);

    // Gradient bar across full spectrum
    const grad = ctx.createLinearGradient(legendX, 0, legendX + barW, 0);
    [0, 20, 40, 55, 70, 85, 100].forEach(v => {
      grad.addColorStop(v / 100, scoreToColor(v));
    });
    ctx.fillStyle = grad;
    roundRect(ctx, legendX, legendY + 8, barW, legendBarH, 5);
    ctx.fill();

    // Scale tick labels
    ctx.font = '10px -apple-system,sans-serif';
    ['0', '25', '50', '75', '100'].forEach((lbl, i) => {
      const lx = legendX + (i / 4) * barW;
      ctx.textAlign = 'center';
      ctx.fillStyle = '#475569';
      ctx.fillText(lbl, lx, legendY + legendBarH + 22);
    });

    // Spectrum labels
    ctx.font = '10px -apple-system,sans-serif';
    ctx.textAlign = 'left';
    ctx.fillStyle = '#dc2626'; ctx.fillText('■ Weak (0–30)', legendX, legendY + legendBarH + 38);
    ctx.fillStyle = '#ca8a04'; ctx.fillText('■ Moderate (31–60)', legendX + 110, legendY + legendBarH + 38);
    ctx.fillStyle = '#7c3aed'; ctx.fillText('■ Strong (61–100)', legendX + 270, legendY + legendBarH + 38);

    // Show stats
    renderStats();

    document.getElementById('heatmap-section').style.display = 'block';
    document.getElementById('heatmap-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function renderStats() {
    const bar = document.getElementById('stats-bar');
    bar.innerHTML = '';

    let totalSum = 0, totalCount = 0;
    const subjectAvgs = SUBJECTS.map(subject => {
      let sum = 0;
      subject.chapters.forEach((_, i) => {
        const v = getValue(subject.key, i);
        sum += v; totalSum += v; totalCount++;
      });
      return { name: subject.name, avg: Math.round(sum / subject.chapters.length) };
    });

    const overall = Math.round(totalSum / totalCount);
    let readiness, riskClass;
    if (overall < 40) { readiness = 'High Risk'; riskClass = 'risk-high'; }
    else if (overall <= 70) { readiness = 'Moderate'; riskClass = 'risk-moderate'; }
    else { readiness = 'Strong Position'; riskClass = 'risk-strong'; }

    const colors = ['#3b82f6', '#10b981', '#ec4899'];
    subjectAvgs.forEach((s, i) => {
      bar.innerHTML += `<div class="stat-pill"><span class="stat-dot" style="background:${colors[i]}"></span>${s.name}: <strong>${s.avg}/100</strong></div>`;
    });
    bar.innerHTML += `<div class="stat-pill">Overall: <strong>${overall}/100</strong></div>`;
    bar.innerHTML += `<div class="stat-pill">Readiness: <span class="readiness-tag ${riskClass}">${readiness}</span></div>`;
  }

  function downloadJPG() {
    const canvas = document.getElementById('heatmap-canvas');
    // Ensure white background by drawing onto a new canvas
    const tmp = document.createElement('canvas');
    tmp.width = canvas.width;
    tmp.height = canvas.height;
    const tctx = tmp.getContext('2d');
    tctx.fillStyle = '#ffffff';
    tctx.fillRect(0, 0, tmp.width, tmp.height);
    tctx.drawImage(canvas, 0, 0);
    const url = tmp.toDataURL('image/jpeg', 1.0);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'jee_clarity_heatmap.jpg';
    a.click();
  }

  function resetAll() {
    Object.keys(state).forEach(k => delete state[k]);
    buildSurvey();
    document.getElementById('heatmap-section').style.display = 'none';
  }

  /* Init */
  function init() {
    buildSurvey();
  }

  return { generateHeatmap, downloadJPG, resetAll, onSelect, init };
})();

App.init();
</script>
</body>
</html>
